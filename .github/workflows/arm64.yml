name: Ubuntu 24.04 ARM64

# The x86 workflows say nothing about aarch64, where the code that picks an instruction set at
# compile time takes a different branch: hawkeye's set of small integers is NEON there and AVX2 on
# the runners above, and only a build on the architecture itself compiles and runs it. This is the
# lean version of ubuntu24.04.yml -- same dependencies, configuration, tests and headless smoke
# test, without the coverage and documentation steps, which are architecture independent and are
# already covered on x86.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

# Cancel a run that has been superseded by a newer push to the same branch. Runs on master are
# never cancelled so that a failure is always attributable to a commit on master.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build_ubuntu_24_04_arm64:
    name: Build and Test on Ubuntu 24.04 ARM64

    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # cmake/hal_cmake_tools.cmake derives the HAL version through 'git describe --tags',
          # so the full history including tags is required
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        shell: bash
        run: echo "timestamp=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_OUTPUT"

      # keyed on the architecture as well: an aarch64 object cache is useless to the x86 workflows
      # and restoring theirs here would only be a slow way of missing on every object
      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path: ${{runner.workspace}}/.ccache
          key: ${{ runner.OS }}-${{ runner.arch }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            ${{ runner.OS }}-${{ runner.arch }}-ccache-

      - name: Install Dependencies
        run: ./install_dependencies.sh

      - name: Configure CMake
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          cd "$GITHUB_WORKSPACE/build"
          export BUILD_TYPE=Debug
          "$GITHUB_WORKSPACE/tools/genversion.py" "$GITHUB_WORKSPACE"
          cmake -G Ninja "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_ALL_PLUGINS=ON -DBUILD_TESTS=ON -DPACKAGE_DEB=OFF -DCMAKE_INSTALL_PREFIX=/usr/
        env:
          CCACHE_DIR: ${{runner.workspace}}/.ccache
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 6
          CCACHE_MAXSIZE: 400M
          HAL_BASE_PATH: ${{github.workspace}}/build

      - name: Build
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build"
          echo "==> Disk usage before clean"
          df -h .
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          echo "==> Disk usage after clean"
          df -h .
          ninja
        env:
          CCACHE_DIR: ${{runner.workspace}}/.ccache
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 6
          CCACHE_MAXSIZE: 400M
          HAL_BASE_PATH: ${{github.workspace}}/build

      # runTest-hawkeye is the one that matters most here: it diffs the NEON implementation of the
      # S-box search's set of small integers against the portable one, which no x86 runner can do.
      - name: Test
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/build"
          ctest --output-on-failure
        env:
          HAL_BASE_PATH: ${{github.workspace}}/build
          CCACHE_DIR: ${{runner.workspace}}/.ccache
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 6
          CCACHE_MAXSIZE: 400M

      # ctest covers the C++ suites but none of them loads a real netlist. This does: it unpacks
      # examples/uart.zip, loads it through hal_py, runs the graph_algorithm plugin, round-trips the
      # project through ProjectManager and renders scoped Graphviz output with tools/hal_viz. Running
      # it here checks that the Python bindings and the plugins load on aarch64, which a build alone
      # does not. Graphviz comes from install_dependencies.sh, so --require-graphviz is mandatory.
      - name: Real-netlist headless smoke test
        id: headless_smoke
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/tests/headless_smoke/real_netlist_smoke.py" \
            --hal-lib "$GITHUB_WORKSPACE/build/lib" \
            --work-dir "$GITHUB_WORKSPACE/build/headless_smoke" \
            --keep --require-graphviz
        env:
          HAL_BASE_PATH: ${{github.workspace}}/build

      # The generated .dot/.svg files and the round-tripped project are what you need to tell a
      # broken renderer from a broken netlist, and they live only on the runner.
      - name: Upload headless smoke test artifacts
        if: always() && steps.headless_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke-ubuntu-24.04-arm64
          path: ${{ github.workspace }}/build/headless_smoke
          if-no-files-found: warn
          retention-days: 7

name: Ubuntu 24.04

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
#  create:
#    tags:
#      - v*

# Cancel a run that has been superseded by a newer push to the same branch. Runs on master are
# never cancelled so that the documentation deployment always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build_ubuntu_24_04:
    name: Build and Test on Ubuntu 24.04

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # cmake/hal_cmake_tools.cmake derives the HAL version through 'git describe --tags',
          # so the full history including tags is required
          fetch-depth: 0

      # Each examples/agilex3_walkthroughs design ships a check.py that re-asserts every
      # load-bearing claim its guide.html makes. This tier is the half that needs nothing but a
      # Python 3 interpreter and tools/hal_agilex (02 and 04 entirely, tier 1 of 03, 06 and 08),
      # so it runs before install_dependencies.sh and the C++ build: a source change that
      # invalidates a walkthrough fails here in seconds instead of an hour into the job. The
      # script clears HAL_BASE_PATH/HAL_PY_PATH/PYTHONPATH for this tier, so it cannot quietly
      # start depending on a built HAL, and it names the failing design in the log.
      - name: Walkthrough checks (no HAL)
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tests/headless_smoke/run_walkthrough_checks.sh" nohal

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        shell: bash
        run: echo "timestamp=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path: ${{runner.workspace}}/.ccache
          key: ${{ runner.OS }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            ${{ runner.OS }}-ccache-

      - name: Install Dependencies
        run: ./install_dependencies.sh

      - name: Create Build Environment
        # Some projects don't allow in-source building, so create a separate build directory
        # We'll use this as our working directory for all subsequent commands
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        # Use a bash shell so we can use the same syntax for environment variable
        # access regardless of the host operating system
        shell: bash
        # Note the current convention is to use the -S and -B options here to specify source
        # and build directories, but this is only available with CMake 3.13 and higher.
        # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
        run: |
          mkdir -p build/doc
          cd build
          export BUILD_TYPE=Debug
          cp $GITHUB_WORKSPACE/documentation/index.html doc/
          $GITHUB_WORKSPACE/tools/genversion.py $GITHUB_WORKSPACE
          cmake -G Ninja $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DBUILD_ALL_PLUGINS=ON -DBUILD_TESTS=ON -DBUILD_COVERAGE=ON -DBUILD_DOCUMENTATION=ON -DPACKAGE_DEB=OFF -DCMAKE_INSTALL_PREFIX=/usr/
        env:
          CCACHE_DIR: ${{runner.workspace}}/.ccache
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 6
          CCACHE_MAXSIZE: 400M
          HAL_BASE_PATH: ${{runner.workspace}}/hal/build

      - name: Build
        shell: bash
        # Execute the build.  You can specify a specific target with "--target <NAME>"
        run: |
          cd build
          echo "==> Disk usage before clean"
          df -h .
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          echo "==> Disk usage after clean"
          df -h .
          ninja
        env:
          CCACHE_DIR: ${{runner.workspace}}/.ccache
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 6
          CCACHE_MAXSIZE: 400M
          HAL_BASE_PATH: ${{runner.workspace}}/hal/build

      - name: Test
        shell: bash
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: |
          cd build
          ctest --rerun-failed --output-on-failure
        #  ninja -v hal_coverage
        # bash <(curl -s https://codecov.io/bash) -f hal_coverage.info.cleaned || echo "Codecov did not collect coverage reports"
        env:
          HAL_BASE_PATH: ${{runner.workspace}}/hal/build
          CCACHE_DIR: ${{runner.workspace}}/.ccache
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 6
          CCACHE_MAXSIZE: 400M

      # The other half of the walkthrough checks. 01, 05 and 10 have no HAL-free tier at all, and
      # 03/06/08 have a second tier that loads netlist.hal.v through the AGILEX_TENNM gate library
      # and re-runs the structural analysis; all of them need build/lib on the path. Sequenced
      # after ctest so a red unit test fails first, and after the "no HAL" tier above, which
      # already caught anything that does not need a build.
      - name: Walkthrough checks (built HAL)
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tests/headless_smoke/run_walkthrough_checks.sh" hal
        env:
          HAL_BASE_PATH: ${{runner.workspace}}/hal/build
          HAL_PY_PATH: ${{runner.workspace}}/hal/build/lib
          PYTHONPATH: ${{runner.workspace}}/hal/build/lib

      # ctest covers the C++ suites and the standalone hal_viz tests, but none of those load a real
      # netlist. This does: it unpacks examples/uart.zip, loads it through hal_py, runs the
      # graph_algorithm plugin, round-trips the project through ProjectManager and renders scoped
      # Graphviz output with tools/hal_viz, asserting the results rather than the exit status. It
      # then writes a findings document about that same seven-gate cone and renders it with
      # `hal_viz report`, checking that the finding, the embedded diagram and the witness link agree
      # on the scope and that the page opens offline.
      # Everything runs headlessly; there is no display server on the runner. Graphviz comes from
      # install_dependencies.sh, so --require-graphviz makes the SVG check mandatory here.
      - name: Real-netlist headless smoke test
        id: headless_smoke
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/tests/headless_smoke/real_netlist_smoke.py" \
            --hal-lib "$GITHUB_WORKSPACE/build/lib" \
            --work-dir "$GITHUB_WORKSPACE/build/headless_smoke" \
            --keep --require-graphviz
        env:
          HAL_BASE_PATH: ${{runner.workspace}}/hal/build

      # The generated .dot/.svg files and the round-tripped project are what you need to tell a
      # broken renderer from a broken netlist, and they live only on the runner.
      - name: Upload headless smoke test artifacts
        if: always() && steps.headless_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke-ubuntu-24.04
          path: ${{ github.workspace }}/build/headless_smoke
          if-no-files-found: warn
          retention-days: 7

      # tools/hal_runner's unit tests (run by ctest above) drive the orchestrator with a stub
      # executor, so they prove the bookkeeping and none of the analysis. This runs the documented
      # command against examples/uart.zip through the real hal binary and checks the manifest, the
      # findings (the UART's 68/50/15 feedback loops, reached through the runner), checkpoint reuse,
      # stale-cache rejection and that a timed-out step fails the run and leaves a diagnostic.
      - name: hal_runner end-to-end run
        id: runner_smoke
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/tests/headless_smoke/runner_smoke.py" \
            --hal-binary "$GITHUB_WORKSPACE/build/bin/hal" \
            --work-dir "$GITHUB_WORKSPACE/build/runner_smoke" \
            --keep
        env:
          HAL_BASE_PATH: ${{runner.workspace}}/hal/build

      # The manifest, the per-step logs and the findings documents are the whole point of the runner;
      # keeping them is what makes a failure diagnosable after the job is gone.
      - name: Upload hal_runner artifacts
        if: always() && steps.runner_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hal-runner-ubuntu-24.04
          path: ${{ github.workspace }}/build/runner_smoke
          if-no-files-found: warn
          retention-days: 7

      # plugins/example_analysis is the unmodified output of tools/new_plugin.py, so the build above
      # (BUILD_ALL_PLUGINS=ON) is what compiles the scaffold template and ctest is what runs its
      # gtest suite. This checks the rest of the promise: that the generated plugin loads, that the
      # capability declaration compiled into it still matches plugins/example_analysis/capabilities.json,
      # that it finds the UART's single clock domain (258 flip-flops on CLK_BUF_BUF), that its driver
      # writes a schema-valid findings document, and that the discovery command tells declared, built,
      # loadable and supported-for-this-netlist apart.
      - name: Plugin scaffold end-to-end run
        id: plugin_scaffold_smoke
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/tests/headless_smoke/plugin_scaffold_smoke.py" \
            --hal-lib "$GITHUB_WORKSPACE/build/lib" \
            --build-dir "$GITHUB_WORKSPACE/build" \
            --work-dir "$GITHUB_WORKSPACE/build/plugin_scaffold_smoke" \
            --keep
        env:
          HAL_BASE_PATH: ${{runner.workspace}}/hal/build

      - name: Upload plugin scaffold artifacts
        if: always() && steps.plugin_scaffold_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-scaffold-ubuntu-24.04
          path: ${{ github.workspace }}/build/plugin_scaffold_smoke
          if-no-files-found: warn
          retention-days: 7

      # HAL's gate-library and netlist parsers are plugins, so a tool CLI that loads a netlist
      # without plugin_manager.load_all_plugins() gets None back -- a bug that was found twice
      # before it was fixed centrally in hal_viz.halenv. This runs one real, direct CLI netlist
      # load per tool in a fresh interpreter (nothing has loaded the plugins for it) and asserts on
      # what each command produced, so a tool that reintroduces the bug fails here.
      - name: Tool CLI plugin-load regression check
        id: tool_cli_plugin_load
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/tests/headless_smoke/tool_cli_plugin_load_smoke.py" \
            --hal-lib "$GITHUB_WORKSPACE/build/lib" \
            --work-dir "$GITHUB_WORKSPACE/build/tool_cli_plugin_load"
        env:
          HAL_BASE_PATH: ${{runner.workspace}}/hal/build

      - name: Upload tool CLI plugin-load artifacts
        if: always() && steps.tool_cli_plugin_load.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tool-cli-plugin-load-ubuntu-24.04
          path: ${{ github.workspace }}/build/tool_cli_plugin_load
          if-no-files-found: warn
          retention-days: 7

      # tools/hal_bitstream's unit tests (run by ctest above) drive it with stub converters, which
      # proves the registry and the error messages and nothing about IceStorm. This installs the
      # real open toolchain and runs the shipped iCE40 fixture bitstream through
      # iceunpack -> icebox_vlog -> yosys -> hal_py, checking the recovered LUTs and flip-flops,
      # the provenance manifest and the HAL project round-trip. yosys is part of the chain, not an
      # extra: icebox_vlog writes behavioural Verilog and HAL's parser reads cell netlists.
      - name: Install open FPGA bitstream toolchain
        shell: bash
        run: sudo apt-get install -y fpga-icestorm yosys

      - name: hal_bitstream end-to-end run
        id: bitstream_smoke
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/tests/headless_smoke/bitstream_smoke.py" \
            --hal-lib "$GITHUB_WORKSPACE/build/lib" \
            --work-dir "$GITHUB_WORKSPACE/build/bitstream_smoke" \
            --keep
        env:
          HAL_BASE_PATH: ${{runner.workspace}}/hal/build

      - name: Upload hal_bitstream artifacts
        if: always() && steps.bitstream_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hal-bitstream-ubuntu-24.04
          path: ${{ github.workspace }}/build/bitstream_smoke
          if-no-files-found: warn
          retention-days: 7
